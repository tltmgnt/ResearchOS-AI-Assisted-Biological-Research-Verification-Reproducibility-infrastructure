[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchos-bio-assurance"
version = "0.1.0"
description = "Deterministic evidence and provenance records for AI-assisted biological research"
requires-python = ">=3.11"
dependencies = ["cryptography>=43,<47"]

[tool.setuptools.packages.find]
include = ["researchos_bio*"]
