name: Tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m researchos_bio evaluate examples/synthetic_record.json --output /tmp/researchos-report.json
      - run: python -m researchos_bio verify examples/synthetic_record.json /tmp/researchos-report.json
